<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QG d'Aurélien</title>
<meta name="theme-color" content="#1E3550">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap">
<script>try{var t=JSON.parse(localStorage.getItem('qg-theme'))||'light';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#15202B; --muted:#5A6672; --line:#D7DDE3;
  --accent:#1E3550; --accent-ink:#FFFFFF; --jaune:#F6C71C; --jaune-ink:#271F00; --raf:#C33E37; --raf-ink:#FFFFFF;
  --ok:#2E8B57; --warn:#C7741A; --danger:#B83A32; --scrim:rgba(12,17,22,.48);
  --n-default:#FFFFFF; --n-grey:#DCE3EA; --n-blue:#C6DAEA; --n-pink:#F1C0BA; --n-yellow:#F6E5A2; --n-green:#CDE6D0; --n-lilac:#DFD5F1;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1317; --surface:#171D24; --surface-2:#1E252D; --ink:#E6EBF0; --muted:#97A2AD; --line:#2B343E;
  --accent:#C9D8EC; --accent-ink:#0F1823; --raf:#E2665E; --raf-ink:#1A0908;
  --ok:#55C08A; --warn:#E89A45; --danger:#E06A60; --scrim:rgba(0,0,0,.6);
  --n-default:#171D24; --n-grey:#28313B; --n-blue:#1D3245; --n-pink:#472826; --n-yellow:#3F3716; --n-green:#1E3829; --n-lilac:#312848;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1317; --surface:#171D24; --surface-2:#1E252D; --ink:#E6EBF0; --muted:#97A2AD; --line:#2B343E;
  --accent:#C9D8EC; --accent-ink:#0F1823; --raf:#E2665E; --raf-ink:#1A0908;
  --ok:#55C08A; --warn:#E89A45; --danger:#E06A60; --scrim:rgba(0,0,0,.6);
  --n-default:#171D24; --n-grey:#28313B; --n-blue:#1D3245; --n-pink:#472826; --n-yellow:#3F3716; --n-green:#1E3829; --n-lilac:#312848;
  color-scheme:dark}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:650;font-size:30px;line-height:1.1;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}

/* Navigation : barre du bas au téléphone, colonne au PC */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:center;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav .brand,.nav .foot,.nav .desk{display:none}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;padding:6px 4px;border-radius:12px;min-width:58px}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"] .ic{background:var(--surface-2);border-radius:999px}
.nav .ic{display:grid;place-items:center;width:46px;height:28px}
.nav .plus{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 4px 14px rgba(15,25,40,.25);flex-shrink:0}
.nav .plus svg{width:26px;height:26px}
.nav .plus .lbl{display:none}
.shell{min-height:100%}
main{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:112px;display:flex;flex-direction:column;gap:18px}
.modebar{display:flex;align-items:center;gap:8px}
.modebar .sp{flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.raf[aria-pressed="true"]{background:var(--raf);color:var(--raf-ink)}
.seg button small{font-weight:600;opacity:.75}
.top .sub{color:var(--muted);margin-top:4px;font-size:14px}
.sync{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;min-width:0;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}
.sync.busy i{background:var(--muted)}
.sync.off i,.sync.err i{background:var(--warn)}
.sync.off,.sync.err{border-color:var(--warn)}
.gear{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.gear[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.gear svg{width:19px;height:19px}
@media (min-width:900px){
  .shell{padding-left:232px}
  .nav{top:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;border-top:0;border-right:1px solid var(--line);
    padding:24px 14px 20px max(14px,env(safe-area-inset-left,0px))}
  .nav .brand{display:block;font-family:var(--f-display);font-weight:700;font-size:20px;padding:0 10px 18px}
  .nav .brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
  .nav a{flex-direction:row;gap:10px;font-size:15px;padding:9px 10px;min-width:0}
  .nav a.desk{display:flex;order:9;margin-top:6px}
  .nav a .ic{width:auto;height:auto}
  .nav a[aria-current="page"]{background:var(--surface-2)}
  .nav a[aria-current="page"] .ic{background:none}
  .nav .plus{order:8;width:auto;height:auto;border-radius:12px;margin:14px 0 0;display:flex;gap:8px;justify-content:center;padding:11px;box-shadow:none;font-weight:600}
  .nav .plus svg{width:20px;height:20px}
  .nav .plus .lbl{display:inline}
  .nav .foot{display:block;order:10;margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;line-height:1.4}
  .gear{display:none}
  main{padding-top:28px;padding-bottom:48px}
  h1{font-size:36px}
}

/* Boutons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px}
.icon-btn{border:0;background:transparent;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.icon-btn[aria-pressed="true"]{color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.link{border:0;background:none;padding:0;font-weight:600;font-size:13.5px;color:var(--muted);text-decoration:none;white-space:nowrap;cursor:pointer}
.link:hover{color:var(--ink);text-decoration:underline}
.cmeta{font-size:13.5px;color:var(--muted)}

/* Accueil */
.home{display:grid;gap:20px}
.home>*{min-width:0}
@media (min-width:1100px){
  .home{grid-template-columns:minmax(0,400px) minmax(0,1fr);grid-template-areas:"urgent pins" "last pins" "soon pins";align-items:start}
  .a-urgent{grid-area:urgent}.a-pins{grid-area:pins}.a-last{grid-area:last}.a-soon{grid-area:soon}
}
.block{display:flex;flex-direction:column;gap:10px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bh .cnt{font-size:13px;font-weight:700;color:var(--danger)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px}
.panel.pad{padding:14px;display:flex;flex-direction:column;gap:12px}
.panel .empty{padding:12px 0;color:var(--muted)}
.mini-notes{display:flex;flex-direction:column}
.mini-notes button{display:flex;justify-content:space-between;gap:10px;align-items:center;border:0;border-top:1px solid var(--line);background:none;padding:11px 0;text-align:left;font-weight:600}
.mini-notes button:first-child{border-top:0}
.mini-notes small{color:var(--muted);font-weight:500;white-space:nowrap}
.urg{list-style:none;margin:0;padding:0}
.urg li{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.urg li:first-child{border-top:0}
.urg label{display:flex;gap:9px;align-items:flex-start;font-weight:600;cursor:pointer;min-width:0}
.urg input{margin:3px 0 0;width:17px;height:17px;flex-shrink:0;accent-color:var(--danger)}
.urg .link{font-size:12.5px;font-weight:500;padding-top:2px;white-space:normal;text-align:right}
.soon{font-size:13.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}

/* Notes et tâches */
.notes{display:grid;gap:16px}
@media (min-width:900px){.notes{grid-template-columns:210px minmax(0,1fr);align-items:start}}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.search input{border:0;background:transparent;padding:10px 0;width:100%;min-width:0;outline:none}
.folders{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.folders button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;white-space:nowrap;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.folders button .c{font-weight:500;color:var(--muted);font-size:12px}
.folders button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.folders button[aria-pressed="true"] .c{color:inherit;opacity:.75}
.folders button.child{display:none}
.folders .manage{border-style:dashed;color:var(--muted)}
@media (min-width:900px){
  .folders{flex-direction:column;overflow:visible;gap:2px}
  .folders button{border:0;background:transparent;border-radius:10px;justify-content:space-between;padding:8px 10px}
  .folders button.child{display:flex;padding-left:26px;font-weight:500}
  .folders .manage{margin-top:8px;border:1px dashed var(--line);justify-content:center}
}
.nbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.crumb{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.crumb button{border:0;background:none;color:var(--muted);padding:0;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.subs{display:flex;gap:8px;flex-wrap:wrap}
.subs button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600}
.subs button svg{width:18px;height:18px;color:var(--muted)}
.subs button small{color:var(--muted);font-weight:500}
.notes-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.card{background:var(--nc,var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.card header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.card header svg{width:16px;height:16px;flex-shrink:0;color:var(--muted);margin-top:2px}
.card footer{font-size:12px;color:var(--muted)}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.cl label{display:flex;gap:9px;align-items:flex-start;font-size:14px;cursor:pointer;overflow-wrap:anywhere}
.cl input{margin:2px 0 0;width:16px;height:16px;flex-shrink:0;accent-color:var(--accent)}
.cl .u{color:var(--danger);font-weight:600}
.flag-i{width:13px;height:13px;color:var(--danger);flex-shrink:0;margin-top:3px}
.flag-i svg{width:13px;height:13px}
.more{font-size:13px;color:var(--muted)}
.preview{font-size:14px;max-height:10.5em;overflow:hidden;overflow-wrap:anywhere;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.preview p{min-height:.6em;margin:0}
.empty-state{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.empty-state strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Paramètres */
.set{display:flex;flex-direction:column;gap:16px;max-width:820px}
.set-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
.set-sec h3{font-family:var(--f-display);font-size:19px;font-weight:650}
.set-sec h4{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.set-rows{display:flex;flex-direction:column}
.set-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:9px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.set-row .in{flex:1 1 140px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:15px}
.set-row select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;font-size:14px;max-width:100%}
.set-row.child{padding-left:22px}

/* Accueil sans lien */
.setup{max-width:560px;display:flex;flex-direction:column;gap:14px}
.setup .in{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;width:100%}

/* Fenêtres */
.overlay{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--nc,var(--surface));color:var(--ink);width:100%;max-height:94%;overflow-y:auto;border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
#editor{overflow:hidden}
@media (min-width:700px){.overlay{align-items:center;padding:24px}.sheet{max-width:680px;border-radius:18px;max-height:88vh}.sheet.small{max-width:480px}}
.ed-head{display:flex;gap:6px;align-items:center;padding:14px 12px 4px 18px}
.ed-title{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-display);font-size:23px;font-weight:600;outline:none;padding:4px 0}
.ed-body{overflow-y:auto;padding:4px 18px 10px;flex:1}
.ed-list{list-style:none;margin:0;padding:0}
.ed-list li{display:flex;align-items:center;gap:6px;border-bottom:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
.ed-list input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent)}
.ed-list .it{flex:1;min-width:0;border:0;background:transparent;padding:9px 0;outline:none}
.ed-list li.urgent .it{color:var(--danger);font-weight:600}
.ed-list li.ok .it{text-decoration:line-through;color:var(--muted);font-weight:400}
.ed-list .x,.ed-list .fl{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.ed-list .x{font-size:20px;opacity:.6}
.ed-list .x:hover{opacity:1}
.ed-list .fl svg{width:17px;height:17px}
.ed-list .fl[aria-pressed="true"]{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.ed-hint{font-size:12.5px;color:var(--muted);padding:2px 0 6px}
.add-item{display:flex;align-items:center;gap:8px;padding:6px 0}
.add-item span{width:18px;text-align:center;color:var(--muted);font-size:20px}
.add-item input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;outline:none}
.done{margin-top:10px;border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent);padding-top:8px}
.done summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;padding:4px 0}
.rt{outline:none;min-height:180px;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.rt p{min-height:1em;margin:0}
.ed-meta{text-align:right;font-size:12px;color:var(--muted);padding:0 18px 6px}
.ed-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px 14px;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.ed-tools .sp{flex:1}
.ed-tools select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;font-size:14px;max-width:200px}
.sw{display:flex;gap:5px}
.sw button{width:24px;height:24px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);background:var(--sc)}
.sw button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.add-pad{padding:20px;display:flex;flex-direction:column;gap:14px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choices button{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px}
.choices svg{width:24px;height:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (min-width:900px){.toast{bottom:28px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Navigation">
    <div class="brand">QG d'Aurélien<small>Perso et RAF</small></div>
    <a href="#accueil" data-view="accueil"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>Accueil</a>
    <button class="plus" type="button" data-new="menu" aria-label="Ajouter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Nouveau</span></button>
    <a href="#notes" data-view="notes"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5z"/><path d="m9 11 1.5 1.5L13 10M9 16h6"/></svg></span>Notes</a>
    <a href="#parametres" data-view="parametres" class="desk"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></span>Paramètres</a>
    <p class="foot" id="foot"></p>
  </nav>

  <main>
    <div class="modebar">
      <div class="seg" role="group" aria-label="Espace">
        <button type="button" data-mode="perso" aria-pressed="true">Perso</button>
        <button type="button" data-mode="raf" class="raf" aria-pressed="false">RAF</button>
      </div>
      <span class="sp"></span>
      <button class="sync" id="sync" type="button" title="Synchroniser maintenant"><i></i><span id="sync-t">…</span></button>
      <a class="gear" href="#parametres" data-view="parametres" aria-label="Paramètres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></a>
    </div>
    <div class="top"><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
    <section id="v-setup" hidden></section>
    <section id="v-accueil"></section>
    <section id="v-notes" hidden></section>
    <section id="v-parametres" hidden></section>
  </main>
</div>

<div class="overlay" id="ov-editor" hidden>
  <div class="sheet" id="editor" role="dialog" aria-modal="true" aria-label="Note">
    <div class="ed-head">
      <input id="ed-title" class="ed-title" placeholder="Titre" aria-label="Titre" autocomplete="off">
      <button id="ed-pin" class="icon-btn" type="button" aria-label="Épingler à l'accueil" title="Épingler à l'accueil" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 3H8v2l1 1v5l-3 3v2h5v6l1 1 1-1v-6h5v-2l-3-3V6l1-1z"/></svg></button>
    </div>
    <div class="ed-body" id="ed-body"></div>
    <div class="ed-meta" id="ed-meta"></div>
    <div class="ed-tools">
      <button id="ed-bold" class="icon-btn" type="button" aria-label="Gras" title="Gras"><b style="font-size:17px">G</b></button>
      <div class="sw" id="ed-colors" role="group" aria-label="Couleur"></div>
      <select id="ed-folder" aria-label="Dossier"></select>
      <span class="sp"></span>
      <button id="ed-dup" class="btn" type="button">Dupliquer</button>
      <button id="ed-del" class="btn" type="button">Supprimer</button>
      <button id="ed-close" class="btn primary" type="button">Fermer</button>
    </div>
  </div>
</div>

<div class="overlay" id="ov-add" hidden>
  <div class="sheet small" role="dialog" aria-modal="true" aria-label="Ajouter">
    <div class="add-pad">
      <h2>Ajouter</h2>
      <div class="choices">
        <button type="button" data-new="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="5" rx="1"/><path d="m4.5 6.5 1 1 2-2M11 6.5h10M11 15.5h10"/><rect x="3" y="13" width="5" height="5" rx="1"/></svg>Liste de tâches</button>
        <button type="button" data-new="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5z"/><path d="M9 11h6M9 15h6"/></svg>Note</button>
      </div>
      <p class="cmeta">L'agenda, les lieux et les repas arrivent aux prochaines étapes.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
